<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Check the status of your ASK Bagbin Education Fund scholarship application."><title>Scholarship Application Status | ASK Bagbin Education Fund</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/responsive.css"><style>.status-wrap{max-width:720px;margin:70px auto;padding:24px}.status-card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 16px 40px rgba(6,59,112,.08)}.status-card h1{margin:0 0 8px}.status-form{display:grid;gap:14px}.status-form label{font-weight:700;font-size:13px}.status-form input{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #d5dbe1;border-radius:8px}.status-form button{border:0;border-radius:8px;padding:12px 16px;background:#0756a0;color:#fff;font-weight:800;cursor:pointer}.status-result{margin-top:18px;padding:16px;border-radius:10px;background:#f5f8fb}.status-pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#e7f4ec;font-weight:800}.error{color:#b42318}</style><link rel="stylesheet" href="../assets/css/mega-navigation.css">
</head><body><main class="status-wrap"><div class="status-card"><img src="../assets/images/logo/logo.png" alt="ASK Bagbin Education Fund" style="width:70px"><h1>Scholarship Application Status</h1><p>Enter your application ID and the email used during submission.</p><form class="status-form" id="statusForm"><label>Application ID<input id="applicationId" type="number" min="1" required></label><label>Email Address<input id="statusEmail" type="email" required></label><button>Check Status</button></form><div id="statusResult" class="status-result" hidden></div></div></main><script src="../assets/js/image-config.js"></script><script src="../assets/js/api-config.js"></script><script>document.getElementById('statusForm').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('statusResult');out.hidden=false;out.textContent='Checking...';try{const id=document.getElementById('applicationId').value,email=encodeURIComponent(document.getElementById('statusEmail').value.trim());const r=await fetch((window.ASK_API_BASE||'/api')+'/public/scholarships/status?id='+id+'&email='+email);const d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to check status.');const a=d.application;out.innerHTML='<strong>'+a.full_name.replace(/[&<>]/g,'')+'</strong><br>'+ (a.programme||'Application') +' · '+(a.institution||'')+'<br><br>Status: <span class="status-pill">'+a.status+'</span><br><small>Submitted: '+new Date(a.submitted_at).toLocaleString()+'</small>';}catch(err){out.className='status-result error';out.textContent=err.message;}});</script><script src="../assets/js/page-loader.js"></script>
</body></html>
