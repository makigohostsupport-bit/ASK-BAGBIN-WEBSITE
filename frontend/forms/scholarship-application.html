<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Scholarship Application | ASK Bagbin Education Fund</title>
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/responsive.css">
<style>
.application-wrap{min-height:100vh;padding:50px 18px;background:linear-gradient(180deg,#f3f8fb,#fff)}.application-card{max-width:900px;margin:auto;background:#fff;border:1px solid #e3e9ee;border-radius:22px;box-shadow:0 18px 50px rgba(6,59,112,.1);overflow:hidden}.application-head{padding:30px;background:linear-gradient(110deg,#063b70,#087443);color:#fff}.application-head img{width:68px;height:68px;object-fit:contain;background:#fff;border-radius:14px;padding:5px}.application-head h1{font-family:Montserrat,sans-serif;font-size:26px;margin:16px 0 5px}.application-head p{font-size:12px;color:rgba(255,255,255,.78)}.application-form{padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.application-form .full{grid-column:1/-1}.application-form label{display:flex;flex-direction:column;gap:6px;color:#344054;font-size:10px;font-weight:700}.application-form input,.application-form select,.application-form textarea{padding:12px;border:1px solid #d8e0e6;border-radius:9px;outline:0;font:inherit;font-size:11px;background:#fff}.application-form input:focus,.application-form select:focus,.application-form textarea:focus{border-color:#5c94c3;box-shadow:0 0 0 3px rgba(7,86,160,.08)}.application-form textarea{min-height:120px;resize:vertical}.application-submit{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:5px}.application-submit button{border:0;border-radius:9px;padding:12px 18px;background:#0756a0;color:#fff;font-size:11px;font-weight:800;cursor:pointer}.application-message{grid-column:1/-1;font-size:11px;font-weight:700}.application-message.success{color:#087443}.application-message.error{color:#c0395b}.field-help{font-size:10px;color:#667085;font-weight:500}.honeypot{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important}@media(max-width:650px){.application-form{grid-template-columns:1fr;padding:20px}.application-form .full,.application-submit,.application-message{grid-column:auto}.application-submit{justify-content:stretch}.application-submit button{width:100%}}
</style>
</head>
<body>
<div class="application-wrap"><div class="application-card">
<div class="application-head"><img src="../assets/images/logo/logo.png" alt="ASK Bagbin Education Fund Logo"><h1>Scholarship Application</h1><p>Apply for educational support from the ASK Bagbin Education Fund.</p></div>
<form class="application-form" id="scholarshipForm">
<label>Full Name<input id="fullName" required></label>
<label>Email Address<input id="email" type="email" required></label>
<label>Phone Number<input id="phone" required autocomplete="tel"></label>
<label>Date of Birth<input id="dob" type="date" required autocomplete="bday"></label>
<label>Programme / Course<input id="programme" required></label>
<label>Level<select id="level" required><option value="">Select level</option><option>SHS</option><option>Certificate</option><option>Diploma</option><option>HND</option><option>Undergraduate</option><option>Postgraduate</option></select></label>
<label>School / Institution<input id="institution" required></label>
<label>Student ID / Index Number<input id="studentId" autocomplete="off"></label>
<label class="full">Why are you applying for this scholarship?<textarea id="reason" required></textarea></label>
<label class="full">Supporting Document <span class="field-help">PDF, DOC or DOCX · maximum 10MB</span><input id="document" type="file" accept="application/pdf,.pdf,.doc,.docx"></label><label class="honeypot" aria-hidden="true">Website<input id="website" tabindex="-1" autocomplete="off"></label><label class="full">Additional Information<textarea id="additional"></textarea></label>
<div class="application-message" id="applicationMessage"></div>
<div class="application-submit"><a href="../pages/scholarship-status.html" style="padding:12px 18px;font-size:11px;font-weight:800">Check Existing Application</a><button type="submit">Submit Scholarship Application</button></div>
</form></div></div>
<script src="../assets/js/image-config.js"></script><script src="../assets/js/api-config.js"></script><script>
document.getElementById('scholarshipForm').addEventListener('submit',async function(e){e.preventDefault();let documentUrl='';const file=document.getElementById('document').files[0];if(file){const fd=new FormData();fd.append('file',file);const upload=await fetch((window.ASK_API_BASE||'/api')+'/uploads/public-document',{method:'POST',body:fd});const uploadData=await upload.json();if(!upload.ok)throw new Error(uploadData.message||'Document upload failed.');documentUrl=uploadData.url;}const payload={fullName:document.getElementById('fullName').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim(),dateOfBirth:document.getElementById('dob').value,studentId:document.getElementById('studentId').value.trim(),programme:document.getElementById('programme').value.trim(),institution:document.getElementById('institution').value.trim(),level:document.getElementById('level').value,statement:document.getElementById('reason').value.trim()+' '+document.getElementById('additional').value.trim(),documentUrl,website:document.getElementById('website').value};const msg=document.getElementById('applicationMessage');try{const r=await fetch((window.ASK_API_BASE||'/api')+'/public/scholarships',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw new Error(data.message||'Submission failed.');msg.className='application-message success';msg.innerHTML=data.message+' <strong>Application ID: '+String(data.applicationId||'').replace(/[^0-9]/g,'')+'</strong>. Save this ID to check your status later.';this.reset();}catch(err){msg.className='application-message error';msg.textContent=err.message;}});</script>
<script src="../assets/js/page-loader.js"></script></body></html>
